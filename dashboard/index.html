<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Marks Dashboard</title>
</head>
<body>

    <h1>Student Marks Dashboard</h1>

    <button id="allBtn">All</button>
    <button id="passedBtn">Passed</button>
    <button id="sortBtn">Sort by Total</button>

    <table border="1">
        <thead>
            <tr>
                <th>Name</th>
                <th>Maths</th>
                <th>Science</th>
                <th>English</th>
                <th>Total</th>
                <th>Average</th>
                <th>Grade</th>
                <th>Rank</th>
            </tr>
        </thead>

        <tbody id="board"></tbody>
    </table>

    <h2>Report JSON</h2>
    <pre id="json"></pre>

    <h2>Paste JSON</h2>
    <textarea id="jsonInput" rows="6" cols="50"></textarea>

    <br>

    <button id="parseBtn">Parse JSON</button>
    <p id="message"></p>

    <script src="script.js"></script>

</body>
</html>
